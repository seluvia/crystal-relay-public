<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crystal Relay Stream Viewer</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070a12;
      color: #f8f4ff;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    #twitch-embed {
      width: 100%;
      height: 100%;
      min-width: 400px;
      min-height: 300px;
      background: #070a12;
    }

    #status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #cdbfee;
      text-align: center;
      background: linear-gradient(135deg, #070a12, #120b22 52%, #081527);
    }

    #status.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="status">Loading Twitch stream...</div>
  <div id="twitch-embed"></div>

  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <script>
    const parentHost = "crystal-relay-live-feedback.test";
    const params = new URLSearchParams(window.location.search);
    const channel = (params.get("channel") || "").replace(/[^A-Za-z0-9_]/g, "");
    const status = document.getElementById("status");

    function showStatus(message) {
      status.textContent = message;
      status.classList.remove("hidden");
    }

    function hideStatus() {
      status.classList.add("hidden");
    }

    if (!channel) {
      showStatus("No Twitch channel was selected.");
    } else if (!window.Twitch || !window.Twitch.Embed) {
      showStatus("Twitch embed script could not be loaded.");
    } else {
      try {
        const embed = new Twitch.Embed("twitch-embed", {
          width: "100%",
          height: "100%",
          channel,
          layout: "video-with-chat",
          autoplay: true,
          muted: false,
          theme: "dark",
          parent: [parentHost]
        });

        embed.addEventListener(Twitch.Embed.VIDEO_READY, hideStatus);
      } catch (error) {
        showStatus("Twitch could not open this stream here.");
      }
    }
  </script>
</body>
</html>
